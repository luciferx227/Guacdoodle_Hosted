    <script>
      // Applies the saved theme before first paint so there is no flash of the
      // wrong palette. No attribute at all means "follow the OS", which the CSS
      // handles via prefers-color-scheme.
      try {
        var t = localStorage.getItem('guacdoodle-theme')
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t)
        }
      } catch (e) {
        /* private mode / blocked storage — fall back to the OS preference */
      }
    </script>
