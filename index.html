      <h1>Guacdoodle — DJ · Producer · Designer · Vibe</h1>
      <p>Guacdoodle is a multi-genre EDM DJ and producer from Iowa — part bass-music selector, part dancer, all vibe.</p>
      <p>Guac's sets swing from heavy dubstep and bass music to drum &amp; bass and flipped bootlegs — from Cue the Bass nights at Sam's Place in Ames, Iowa, to back-to-backs with AlienBoii in Minneapolis and the ADAPT DOODLE debut with Adapt Idol at Lost Woods Music Festival 2026 in Cedar Falls.</p>
      <p>Off the decks, Guac is a designer, promoter, dancer and flow artist — the creator of Dubilluminaughty, an underground movement built on peace, love and empowerment, and GuacdoodleS, a brand raising the vibration through music, art, stories, goods and events. Catch the live streams, the 2-hour song challenges and the Chasing Dreams IRL interviews on Twitch and YouTube.</p>
